<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal GTK - Kontak</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header>
      <nav class="navbar">
        <div class="logo">Portal GTK</div>

        <ul class="menu">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="profil.html">Profil GTK</a></li>
          <li><a href="informasi.html">Informasi</a></li>
          <li><a href="kontak.html" class="active">Kontak</a></li>
        </ul>
      </nav>
    </header>

    <!-- Header -->
    <section class="page-header">
      <h1>Kontak</h1>
      <p>Hubungi kami untuk informasi lebih lanjut</p>
    </section>

    <!-- Kontak -->
    <section class="contact">
      <div class="contact-info">
        <h2>Informasi Kontak</h2>

        <div class="contact-item">
          <span>📍</span>
          <div>
            <h3>Alamat</h3>
            <p>Kantor GTK Provinsi Gorontalo</p>
          </div>
        </div>

        <div class="contact-item">
          <span>📞</span>
          <div>
            <h3>Telepon</h3>
            <p>(0435) 000000</p>
          </div>
        </div>

        <div class="contact-item">
          <span>✉️</span>
          <div>
            <h3>Email</h3>
            <p>info@gtk.go.id</p>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <h2>Kirim Pesan</h2>

        <form>
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama" required />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          />

          <label for="pesan">Pesan</label>
          <textarea
            id="pesan"
            rows="5"
            placeholder="Tulis pesan Anda"
            required
          ></textarea>

          <button type="submit">Kirim Pesan</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 Portal Informasi GTK</p>
      <p>Guru dan Tenaga Kependidikan</p>
    </footer>
  </body>
</html>
